<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz z pytaniami</title>
</head>
<hr>

<body>
    <h1>Formularz z pytaniami</h1>
    <form>
        <label for="imie">Imię:</label>
        <input type="text" id="imie" name="imie" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="pytanie">Twoje pytanie:</label><br>
        <textarea id="pytanie" name="pytanie" rows="5" cols="50" required></textarea><br><br>

        <input type="submit" value="Wyślij">
    </form>
</body>
<br>
<hr>
<h2>tabela</h2>
<table border="5">
    <tr>
        <th>Imię</th>
        <th>Email</th>
        <th>Pytanie</th>
    </tr>
    <tr>
        <td>Jan</td>
        <td>jan@example.com</td>
        <td>Jak się masz?</td>
    </tr>
</table>
<h2>Link do strony z pytaniami</h2>
<a href="https://www.example.com/pytania" target="_blank">Kliknij tutaj, aby przejść do strony z pytaniami</a><br><br>
